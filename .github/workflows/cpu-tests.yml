name: CPU Tests (M0-1.5)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy" "scipy" "torch" "scikit-learn" "jsonschema" "pytest"

      - name: JSON Schema validation (well-formed)
        run: python -c "import json; s=json.load(open('data/manifests/templates/ndt_manifest_schema.json')); print('schema JSON OK, version', s['manifest_version'])"

      - name: python compileall (syntax check all sources/scripts/tests)
        run: python -m compileall -q src scripts tests

      - name: Run NDT interface tests (test_nd_interfaces.py)
        run: python tests/test_nd_interfaces.py

      - name: Run manifest schema tests
        run: python tests/test_manifest_schema.py

      - name: Run Synth-UT tests
        run: python tests/test_synth_ut.py

      - name: Run eval protocol (anti-leak) tests
        run: python tests/test_eval_protocol.py
