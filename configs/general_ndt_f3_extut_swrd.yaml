# ============================================================
# General NDT Foundation — F3: PENELOPE + extUT + SWRD (模态互补)
# 用户矩阵 E3 对应。外部步数合计 3000: extUT 1500 (random, 无标签) +
#   SWRD 1500 (region_bias 0.5)。对照 F1/F2 检验模态互补。
# 协议: E2b 同款 (per-fold 严格, 模态专用 stem, 冻结探针, 3 seed)。
# 对照: E1 0.5680 (锚点) / 旧管线天花板 0.579。判据: Δ≤−0.01 = stop。
# ============================================================
experiment: F3

sources:
  - dataset: penelope_paut
    steps: 3000
    mask_policy: random
    config: {label_type: binary}
  - dataset: external_weld_ut
    steps: 1500
    mask_policy: random
    config: {groups: [A, B, C, D]}
  - dataset: swrd
    steps: 1500
    mask_policy: {mode: region_bias, region_frac: 0.5}
    config: {image_size: 256}

model:
  d_model: 128
  patch_len: 16
  patch2d: 16
  n_layers_enc: 4
  n_heads: 4
  d_decoder: 128
  n_layers_dec: 1
  mask_ratio: 0.5
  n_modalities: 9
  n_sensors: 32
  dropout: 0.1
  per_modality_stem: true

ssl:
  n_steps: 6000
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  normalize: per_sample
  model_seeds: [0, 1, 2]
  data_seed: 42
  log_every: 1000
  ckpt_every: 6000

probe:
  val_frac: 0.15

baselines:
  e1_mean: 0.5680
  e1_per_seed: {0: 0.5740, 1: 0.5557, 2: 0.5744}
  e2b_mean: 0.5946

output_dir: experiments/runs/general_ndt_f3
