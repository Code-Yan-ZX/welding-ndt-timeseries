    samples: 17000
    channels: 1
    length: 480
    spatial_scan: true
    labels: "0/1 + 深度/位置/尺寸/类型"
    split_protocol: "仅限受控实验 (defect_instance_id + real/sim 分组); 随机样本级结果无效"
    leak_risk: {specimen: "n/a", slice: medium, augmentation: high}
    reuse: "仅受控: smoke/管线测试 / 合成缺陷预训练消融 / shortcut-leakage 负对照 / 模板依赖验证"
    forbidden: "论文主结果 / 通用表征主要证据 / 跨试件 claim / 与真实工业数据直接比较 / SOTA claim"
    notes: "单试件 P41 + 6 真实缺陷 + 10 CIVA 模板; 真实批 0.4-1.0 幅度缩放; 随机 AUC≈1.0; leave-one-real-defect-out AUC 仍=1.0 但为同试件内泛化 (非跨试件)"

