    split_protocol: "按时间分段划分 (防时间相关泄漏)"
    leak_risk: {specimen: high, slice: high, augmentation: none}
    reuse: "导波域无标签预训练 (B) + 损伤严重度/环境迁移验证 (C)"
    notes: "4.5 年长期监测; 单结构(1 铝板) → 非多结构核心基准; NC-ND 许可合规需评估; 时间分段严格划分"
    admission_note: "单结构不满足 A 级准入 (多独立 specimen); 仅作预训练语料 + 单结构迁移验证"

# ---------------- D 级: quarantined (shortcut 高风险) ----------------
# 依据: docs/M0_2B_VTT_virtual_flaw_data_audit_v2.md (2026-08-20)
#   - 单试件 + 重复缺陷模板 + 虚拟缺陷注入/增强 + 背景相关性;
#   - 随机样本级小 CNN 缺陷检测 AUC≈1.0 (近饱和), 99.3-99.7% test 样本在 train
#     中有 cos>0.99 同模板近重复; leave-template-out 后小裂纹崩塌 (AUC 0.41<机会);
#   - E2 外部预训练对 PAUT 为负迁移 (E2−E0 = −0.0075, 判据未过)。
#   → 随机划分结果不代表跨试件泛化, 不得与真实工业 NDT 数据直接比较。
  ml_ndt:
    tier: D
    status: quarantined
    shortcut_risk: high
    core_benchmark: false
    headline_results_allowed: false
    cross_specimen_claim_allowed: false
    sota_claim_allowed: false
    modality: ultrasonic
    name: "ML-NDT (VTT 管道焊缝) — QUARANTINED"
    source: "github.com/iikka-v/ML-NDT; arXiv:1903.11399"
    license: "LGPL-3.0 (数据授权语义待确认)"
    download: "已本地 (data/raw/ML-NDT/, 2.5GB)"
    format: ".bins UInt16 256x256x100 (minibatch 容器 = 100 张 B-scan, 非体积采集)"
    independent_units: {specimens: 1, defects: 3}
    samples: 20010
    channels: 1
    length: 256
    spatial_scan: true
    labels: "0/1 + equivalent_flaw_size"
    split_protocol: "仅限受控实验 (defect_instance_id 分组); 随机样本级结果无效"
    leak_risk: {specimen: "n/a", slice: high, augmentation: high}
    reuse: "仅受控: smoke/管线测试 / 合成缺陷预训练消融 / shortcut-leakage 负对照 / 模板依赖验证"
    forbidden: "论文主结果 / 通用表征主要证据 / 跨试件 claim / 与真实工业数据直接比较 / SOTA claim"
    notes: "eFlaw 流程: 3 条真实裂纹信号植入不同位置/背景 → 20,010 图; 随机 AUC≈1.0 为模板近重复+背景捷径; 近重复 cos>0.99 占 99.3-99.7%; leave-template 小裂纹崩塌"

  ndt_ml_flaw:
    tier: D
    status: quarantined
    shortcut_risk: high
    core_benchmark: false
    headline_results_allowed: false
    cross_specimen_claim_allowed: false
    sota_claim_allowed: false
    modality: ultrasonic
    name: "NDT_ML_Flaw (VTT 异种金属焊缝) — QUARANTINED"
    source: "github.com/koomas/NDT_ML_Flaw"
    license: "LGPL-3.0 (数据授权语义待确认)"
    download: "已本地 (data/raw/NDT_ML_Flaw/, 227MB 压缩)"
    format: ".xz/.lzma uint16 条带 (480x7168)"
