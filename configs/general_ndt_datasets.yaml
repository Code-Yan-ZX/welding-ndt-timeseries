# ============================================================
# General NDT Foundation — 多源 NDT 数据集 Registry (Phase 1)
# 分支: research/general-ndt-foundation
# 日期: 2026-09-01
#
# 目的: 建立公开/本地 NDT 数据集的统一注册表。本阶段只做 registry,
#       不立即下载全部数据。
#
# 分级:
#   A 核心 benchmark     —— 可严格下游评测 (多独立单元 + 可靠标签 + 许可清晰)
#   B 无标签预训练       —— 原始信号语料 (标签弱/单试件, 仅预训练, 需防泄漏分组)
#   C 外部迁移验证       —— 模态相关可下载, 但规模小/单结构, 仅迁移对照
#   D quarantined        —— shortcut/shortcut 高风险: 重复缺陷模板 / 虚拟缺陷注入 /
#                           背景相关性显著 (如 ML-NDT / NDT_ML_Flaw), 仅限受控用途
#
# 数据集状态 (status):
#   ready       —— 可正常接入训练/评测
#   quarantined —— 仅限受控用途 (见下), 不得作为核心 benchmark / 论文主结果
#
# quarantine 数据集允许用途:
#   1) loader 与管线 smoke test; 2) 合成缺陷预训练的受控消融;
#   3) shortcut/leakage detection 负对照; 4) random split vs grouped split 虚高对比;
#   5) 模板依赖验证; 6) 合成数据负迁移机理研究
# 禁止用途:
#   论文主结果 / 通用表征有效性主要证据 / 跨试件泛化 claim /
#   与工业真实数据直接比较 / SOTA claim
#
# 严格评测原则 (勿忘):
#   1) 同试件切片 / 增强副本 / 同缺陷重复采样 绝不随机跨 train/test;
#   2) 样本数 ≠ 独立缺陷数 ≠ 独立试件数;
#   3) 评估统一 每折均值±std + 负迁移审计, 不比较 pooled 与逐折。
# ============================================================

schema_version: 1.1

# 模态枚举 (与 manifest schema 对齐)
modalities:
  - ultrasonic      # PAUT / FMC / TOFD / B-scan
  - guided_wave     # Lamb / 扭转-弯曲导波
  - eddy_current    # ECT
  - acoustic_emission
  - vibration       # 振动加速度 (模态红线: 默认 D)
  - process         # 工艺电信号 (非 NDT 信号, 排除)
  - fusion          # 成对多模态 (当前无公开数据, 融合训练推迟)

# ---------------- A 级: 核心 benchmark ----------------
datasets:
  penelope_paut:
    tier: A
    modality: ultrasonic
    name: "PENELOPE / Submerged Arc Welding Open Repository"
    source: "Zenodo 15083865, DOI 10.5281/zenodo.15083865"
    license: "CC-BY-4.0"
    download: "已本地 (data/raw/saw/, 12.7GB zip)"
    format: ".nde (HDF5, OmniScan X3)"
    independent_units: {specimens: 5, coupons: 5, defects: 243}
    samples: 3000
    channels: 49
    length: 512
    spatial_scan: true
    labels: "0/1 + 缺陷类型码 (6类); 无深度/尺寸"
    split_protocol: "Protocol V2: coupon LOOCV (非PP4 逐折均值)"
    leak_risk: {specimen: none, slice: low, augmentation: none}
    reuse: "目标域严格评测基准 (之一)"
    notes: "PP4 近零缺陷已知; 缺陷率-试件耦合 0.5%-76%"

  eddycus_hdf5:
    tier: "B/C (pending admission)"
    benchmark_tier: "B/C pending admission"
    core_benchmark: false
    headline_results_allowed: false
    cross_specimen_claim_allowed: false
    sota_claim_allowed: false
    specimen_id_available: false
    inferred_group_available: true
    inferred_group_contains_label: true
    modality: eddy_current
    name: "EddyCus-HDF5 / Open-Source Multi-Sensor ECT Database"
    source: "Zenodo 19251759, DOI 10.5281/zenodo.19251759"
    license: "CC-BY-4.0 (数据) / MIT (软件)"
    download: "已本地 (data/raw/EddyCus-HDF5/, 6.9GB)"
    format: "HDF5 (四层组, signal_data/fN real/imag)"
    independent_units: {specimens_explicit: 0, config_groups_inferred: 148, defects: 8}
    samples: 738
    channels: 8
    length: 45551
    spatial_scan: true
    labels: "8 类缺陷"
    split_protocol: "cross-config (inferred group) / cross-sensor / cross-material — 仅 exploratory; 禁止 cross-specimen claim"
    leak_risk: {specimen: "n/a (无显式试件)", slice: medium, augmentation: none}
    reuse: "无标签预训练语料 + cross-sensor/cross-material 探索实验 (exploratory)"
    admission_note: "148 为代码推断的配置组哈希 (material|fiber|layup|description|defect_depth|defect_size|thickness), 不是数据集显式物理试件 ID; 只有原始文件/官方论文/作者元数据证明配置组与独立物理试件一一对应, 才允许重新申请 A 级"
    notes: "CFRP 非金属焊缝; 模态差异大; 支持 exploratory_flat_1d 与 native_grid_2d 两种表示"

  longterm_guided_wave_shm:
    tier: B
    modality: guided_wave
    name: "Long-term Guided Wave SHM (Sci. Data 2025)"
    source: "DOI 10.1038/s41597-025-05300-5; Figshare 10.6084/m9.figshare.28112504"
    license: "CC BY-NC-ND 4.0 (非商业, 禁改)"
    download: "待人工核实 (Figshare; 本机被 Cloudflare 拦截)"
    format: ".pickle 原始时域波形 (1 MHz)"
